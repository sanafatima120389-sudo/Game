name: Build Battle Zone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            unzip \
            wget \
            zip

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            buildozer==1.6.0 \
            "cython<3.4" \
            virtualenv

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f Battle_Zone_Game_Icon_512.png

      - name: Check Buildozer settings
        run: |
          grep -n "android.accept_sdk_license" buildozer.spec
          grep -n "android.ndk" buildozer.spec
          grep -n "android.api" buildozer.spec
          grep -n "android.archs" buildozer.spec
          grep -n "requirements" buildozer.spec

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          P4A_RELEASE: "1"
        run: |
          buildozer -v android debug

      - name: Verify APK
        run: |
          echo "===== APK FILE ====="
          find bin -maxdepth 1 -type f -name "*.apk" -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          echo "===== APK SIZE ====="
          ls -lh bin/*.apk

          echo "===== APK TYPE ====="
          file bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battle-zone-apk
          path: bin/*.apk
          if-no-files-found: error
